<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ICH Hub - Godown Activity Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* WhatsApp & Mobile Scroll Fix */
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #0b1320;
      color: #ffffff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .wrapper {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 80px 16px; /* नीचे स्क्रॉल के लिए पैडिंग */
    }

    /* Header Card */
    .header-card {
      background: #172338;
      border: 1px solid #233554;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .header-icon {
      background: #f59e0b;
      color: #000;
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
    }

    .header-text p {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
      line-height: 1.3;
    }

    /* Main Login Card */
    .main-card {
      background: #131c2e;
      border: 1px solid #1e2d48;
      border-radius: 20px;
      padding: 28px 20px;
      text-align: center;
    }

    .shield-icon {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f59e0b;
      width: 65px;
      height: 65px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px auto;
    }

    .main-card h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .main-card .subtitle {
      font-size: 0.82rem;
      color: #94a3b8;
      margin-bottom: 24px;
    }

    /* Form Styles */
    .form-group {
      text-align: left;
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1rem;
    }

    .input-wrapper input, .input-wrapper select {
      width: 100%;
      padding: 14px 14px 14px 42px;
      background: #0b1320;
      border: 1px solid #233554;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-wrapper input:focus, .input-wrapper select:focus {
      border-color: #f59e0b;
    }

    /* Action Button */
    .btn-submit {
      width: 100%;
      background: #f59e0b;
      color: #0b1320;
      border: none;
      padding: 15px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Quick Demo Profile Section */
    .demo-section p {
      font-size: 0.78rem;
      color: #64748b;
      margin-bottom: 12px;
    }

    .demo-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .demo-btn {
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      background: #1e293b;
    }

    .demo-btn.admin {
      color: #38bdf8;
      border-color: #0369a1;
    }

    .demo-btn.supervisor {
      color: #a78bfa;
      border-color: #6d28d9;
    }

    .demo-btn.pending {
      color: #f87171;
      border-color: #b91c1c;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- Header -->
    <div class="header-card">
      <div class="header-icon">
        <i class="fa-solid fa-warehouse"></i>
      </div>
      <div class="header-text">
        <h1>ICH Hub - Godown Activity Portal</h1>
        <p>आई.सी.एच हब - दैनिक चेकलिस्ट, गेट पास एवं रोल-आधारित नियंत्रण पोर्टल</p>
      </div>
    </div>

    <!-- Login Container -->
    <div class="main-card">
      <div class="shield-icon">
        <i class="fa-solid fa-shield-halved"></i>
      </div>

      <h2>Employee Login (लॉगिन)</h2>
      <p class="subtitle">अपना अधिकृत ईमेल दर्ज करके सिस्टम में प्रवेश करें</p>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>OFFICIAL EMAIL ID (ईमेल आईडी)</label>
          <div class="input-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="emailInput" placeholder="name@ichhub.com" required>
          </div>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-right-to-bracket"></i> Verify & Enter Dashboard
        </button>
      </form>

      <div class="demo-section">
        <p>Quick Demo Profiles (टेस्ट हेतु क्लिक करें):</p>
        <div class="demo-buttons">
          <button class="demo-btn admin" onclick="setDemo('admin@ichhub.com')">Admin</button>
          <button class="demo-btn supervisor" onclick="setDemo('supervisor@ichhub.com')">Supervisor</button>
          <button class="demo-btn pending" onclick="setDemo('newuser@ichhub.com')">Pending</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function setDemo(email) {
      document.getElementById('emailInput').value = email;
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      alert("लॉगिन सफल: " + email);
      // यहाँ डैशबोर्ड पेज का लिंक जोड़ें (उदा. window.location.href = 'dashboard.html')
    }
  </script>
</body>
</html>
